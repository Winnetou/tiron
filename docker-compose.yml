# The backend, its PostgreSQL database, the frontend, and the RabbitMQ broker
# with the Celery worker.
#
#   docker compose up --build        (or: make up)
#
# The database name, user and password come from .env (see .env.example); the
# password has no default and must be set. The frontend is then at
# http://localhost:5173 (FRONTEND_PORT).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tiron}
      POSTGRES_USER: ${POSTGRES_USER:-tiron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD, e.g. in .env}
    volumes:
      # The data lives in this named volume, so it survives `docker compose down`
      # and rebuilding or removing the containers.
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the database is reachable as "db".
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-tiron}
      POSTGRES_USER: ${POSTGRES_USER:-tiron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD, e.g. in .env}
      # This compose file is for development, with its own database: the backend
      # creates the schema in it when it starts. (In production PROD is true, the
      # default, and the schema is not created by the app.)
      PROD: ${PROD:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The backend sends tasks to the celery-worker through the broker.
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-tiron}:${RABBITMQ_PASSWORD:-tiron}@rabbitmq:5672//
    volumes: 
      - ./app:/app/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      # The backend only starts answering once it has loaded the spaCy model and
      # the dictionary: about 40 s when the disk cache is warm, but a few minutes
      # on a cold start.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s

  rabbitmq:
    image: rabbitmq:4
    restart: unless-stopped
    # RabbitMQ keeps its data under the node name, which is made of the hostname:
    # without a fixed one, a recreated container would not find its queues.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-tiron}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-tiron}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    # Not published: only the containers of this compose network reach the broker.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  celery-worker:
    # The same image as the backend: the tasks are part of the app.
    build: .
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.celery_app
      - worker
      - --loglevel=${LOG_LEVEL:-INFO}
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-tiron}:${RABBITMQ_PASSWORD:-tiron}@rabbitmq:5672//
      # The tasks use the database, which is reachable as "db" in the network.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-tiron}
      POSTGRES_USER: ${POSTGRES_USER:-tiron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD, e.g. in .env}
      PROD: ${PROD:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./app:/app/app

  frontend:
    build: ./frontend
    restart: unless-stopped
    # Only started, not healthy: the backend takes minutes to load its models,
    # and the page works as soon as the backend answers.
    depends_on:
      - backend
    environment:
      # The dev server proxies the backend's routes here (see vite.config.ts).
      BACKEND_URL: http://backend:8000
    volumes:
      # The sources, so that edits show at once; the dependencies are the ones
      # installed in the image (the anonymous volume keeps the host's
      # node_modules, built for another system, out of the container).
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  db-data:
  rabbitmq-data:
