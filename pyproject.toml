[project]
name = "tiron"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "autocorrect>=2.6.1",
    "delb>=0.6.1",
    "fastapi>=0.162.0",
    "phunspell>=0.1.6",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "spacy>=3.8.18",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
